kind: Pod
apiVersion: v1

metadata:
  name: stress-pod

spec: 
  containers:
  - name: stress
    image: polinux/stress:latest
    command: ["stress"]
    resources: 
      requests:
        memory: 10Mi
      limits:
        memory: 100Mi
    args: ["--vm", "1", "--vm-bytes", "200M", "--vm-hang", "1"]
