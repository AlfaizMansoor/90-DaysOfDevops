kind: Pod
apiVersion: v1

metadata:
  name: liveness-pod

spec:
  containers:
  - name: liveness
    image: busybox:latest
    command: 
    - sh
    - -c
    - |
      touch /tmp/healthy
      echo "File /tmp/healthy created. Waiting 30 seconds..."
      (sleep 30 && rm -f /tmp/healthy && echo "File /tmp/healthy deleted!") &
            while true; do sleep 5; done
    livenessProbe:
      exec:
        command:
        - cat
        - /tmp/healthy
      periodSeconds: 5
      failureThreshold: 3
