<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Introduction Page</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 0.3em;
    }
    h2 {
      font-weight: 400;
      margin-bottom: 1em;
    }
    p {
      font-size: 1.2em;
      max-width: 600px;
      margin-bottom: 2em;
    }
    .button {
      padding: 12px 24px;
      background: #fff;
      color: #764ba2;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .button:hover {
      background: #764ba2;
      color: #fff;
    }
    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.9em;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>Hello, I'm Alfaiz Mansuri</h1>
  <h2>DevOps Engineer</h2>
  <p>Passionate about Docker, Flask, and cloud technologies. I love building clean, modern solutions that make systems more reliable and scalable.</p>
  <button class="button">View My Work</button>
  <footer>© 2026 Alfaiz Mansuri</footer>
</body>
</html>
