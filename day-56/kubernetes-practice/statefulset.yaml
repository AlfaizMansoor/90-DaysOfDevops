kind: StatefulSet
apiVersion: apps/v1

metadata:
  name: web

spec:
  selector:
    matchLabels:
      app: nginx-day56
  serviceName: "headless-service"
  replicas: 3
  template:
    metadata:
      labels:
        app: nginx-day56
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: nginx
        image: registry.k8s.io/nginx-slim:0.24
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx

  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard"
      resources:
        requests:
          storage: 100Mi
