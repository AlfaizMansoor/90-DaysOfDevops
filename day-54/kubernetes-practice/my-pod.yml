apiVersion: v1
kind: Pod
metadata:
  name: my-pod
spec:
  containers:
  - name: nginx
    image: nginx:latest
    env:
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            name: db-credentials
            key: DB_USER
    volumeMounts:
       - name: secret-volume
         mountPath: /etc/db-credentials
         readOnly: true

  volumes:
    - name: secret-volume
      secret:
        secretName: db-credentials
