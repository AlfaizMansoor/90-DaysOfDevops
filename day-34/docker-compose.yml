# This is my second docker-compose  assignment

services:
  web:
    image: python:3.10-slim 
    container_name: app-stack
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "pip install flask mysql-connector-python redis && python app.py"
    ports:
      - "5000:5000"
    networks:
      - stacknet

  db:
    image: mysql
    container_name: stack-database
    volumes:
      - stackapp-volume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - stacknet

  cache:
    image: redis
    container_name: cache-stack
    ports:
      - "6379:6379"
    volumes:
      - stackcache-volume:/data
    networks:
      - stacknet

volumes:
  stackapp-volume: 
  stackcache-volume: 

networks:
  stacknet:
    driver: bridge
