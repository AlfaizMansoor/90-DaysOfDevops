<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Showcase</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px 0;
    }
    h1 {
      margin: 0;
    }
    section {
      padding: 30px;
    }
    .car-card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
    }
    .car-card img {
      width: 100%;
      border-radius: 8px;
    }
    footer {
      background-color: #2c3e50;
      color: white;
      padding: 10px 0;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Car Showcase</h1>
    <p>Explore sleek designs and powerful performance</p>
  </header>

  <section>
    <div class="car-card">
      <h2>Sports Car</h2>
      <img src="car.jpg" alt="Sports Car">
      <p>This sports car combines speed, style, and cutting-edge technology. Perfect for enthusiasts who love performance and design.</p>
    </div>
  </section>

  <footer>
    <p>© 2026 Car Showcase</p>
  </footer>
</body>
</html>
